<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>55 Вхід</title>
    <link rel="icon" type="image/x-icon" href="/images/55tab.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container-login">
        <section class="auth-shell">
            <div class="auth-card">
                <div class="auth-badge">Secure Access</div>
                <div class="auth-blocks">
                    <div class="unit-name">
                        <div class="unit-number">55 ОАБР</div>
                        <div class="unit-title">«Запорізька Січ»</div>
                    </div><img src="/images/55logo.png" alt="55oabr-logo">
                </div>
                <div id="loginError" class="error-message"></div>
                <form id="loginForm" class="auth-form">
                    <label class="auth-label">Логін<input id="username" value="" class="auth-input" type="text"
                            autocomplete="username"></label>
                    <label class="auth-label">Пароль<input id="password" value="" class="auth-input" type="password"
                            autocomplete="current-password"></label><!---->
                    <button class="auth-button" type="submit">Увійти</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.textContent = '';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    errorBox.textContent = 'Невірний логін або пароль';
                    return;
                }

                // Сервер сам поставив httpOnly-cookie з токеном - нам лишається просто перейти на дашборд
                window.location.href = '/';
            } catch (err) {
                errorBox.textContent = 'Помилка з\'єднання з сервером';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
